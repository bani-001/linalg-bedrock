[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linalg-bedrock"
version = "0.1.0"
description = "Linear algebra decompositions from raw arrays, validated against LAPACK."
requires-python = ">=3.9"
authors = [{name = "Bedrock Project"}]
license = {text = "MIT"}

[project.optional-dependencies]
dev = ["numpy>=1.24", "scipy>=1.10", "pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]